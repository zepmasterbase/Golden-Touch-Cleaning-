<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaner Authentication</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    color:white;
}

.auth-container{
    width:380px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 40px rgba(0,255,255,0.1);
    position:relative;
    overflow:hidden;
}

.auth-container::before{
    content:'';
    position:absolute;
    width:150px;
    height:150px;
    background:radial-gradient(circle,#00f2ff55,transparent);
    top:-40px;
    right:-40px;
}

h2{
    text-align:center;
    margin-bottom:30px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:14px;
}

input:focus{
    outline:none;
    border:1px solid #00f2ff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00f2ff,#7c3aed);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px #00f2ff88;
}

.toggle{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    cursor:pointer;
    color:#00f2ff;
}

.message{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:#ff6b6b;
}
</style>
</head>

<body>

<div class="auth-container">

<h2 id="formTitle">Cleaner Login</h2>

<input type="tel" id="phone" placeholder="Phone Number" required>
<input type="password" id="password" placeholder="Password" required>

<button onclick="handleAuth()">Login</button>

<div class="toggle" onclick="toggleMode()">
    Don't have an account? Sign Up
</div>

<p class="message" id="message"></p>

</div>

<script>
let isLogin = true;

function toggleMode(){
    isLogin = !isLogin;
    document.getElementById("formTitle").innerText = isLogin ? "Cleaner Login" : "Create Cleaner Account";
    document.querySelector("button").innerText = isLogin ? "Login" : "Sign Up";
    document.querySelector(".toggle").innerText = isLogin 
        ? "Don't have an account? Sign Up" 
        : "Already have an account? Login";
    document.getElementById("message").innerText = "";
}

function handleAuth(){
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    if(phone.length < 10){
        message.innerText = "Enter valid phone number.";
        return;
    }

    if(password.length < 4){
        message.innerText = "Password must be at least 4 characters.";
        return;
    }

    let users = JSON.parse(localStorage.getItem("cleanerUsers")) || {};

    if(isLogin){
        if(!users[phone]){
            message.innerText = "Account not found.";
            return;
        }

        if(users[phone].password !== password){
            message.innerText = "Incorrect password.";
            return;
        }

        localStorage.setItem("loggedInCleaner", phone);
        window.location.href = "dashboard.html";

    } else {
        if(users[phone]){
            message.innerText = "Account already exists.";
            return;
        }

        users[phone] = {
            password: password,
            createdAt: new Date().toISOString()
        };

        localStorage.setItem("cleanerUsers", JSON.stringify(users));
        localStorage.setItem("loggedInCleaner", phone);

        window.location.href = "dashboard.html";
    }
}

// Auto redirect if already logged in
if(localStorage.getItem("loggedInCleaner")){
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
