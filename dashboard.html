<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaner Dashboard - Golden Touch Cleaning</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Basic Reset */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:#0F172A;color:white;line-height:1.5;}
a{text-decoration:none;color:inherit;}

/* Header */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 25px;
    background:linear-gradient(90deg,#00E5FF,#FFD700,#39FF14);
    animation:pulse 3s infinite;
    border-bottom:1px solid #333;
}
@keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.85;}
}
header h1{font-size:1.5rem;font-weight:600;}
header .profile-btn{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
}
header .profile-btn img{
    width:40px;height:40px;border-radius:50%;object-fit:cover;
    border:2px solid #FFD700;
}
header button.logout{
    margin-left:15px;
    background:#ef4444;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    color:white;
}

/* Stats Cards */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:20px;
    padding:20px;
}
.stats .card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:12px;
    text-align:center;
    transition:0.3s;
}
.stats .card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 15px #00E5FF66;
}
.stats .card h2{font-size:1.5rem;margin-bottom:5px;}
.stats .card p{opacity:0.8;font-size:0.9rem;}

/* Booking Table */
table{
    width:100%;
    border-collapse:collapse;
    margin:20px 0;
}
th,td{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    text-align:center;
    font-size:0.9rem;
}
th{
    background:rgba(255,255,255,0.05);
    font-weight:600;
}
button.action{
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin:2px;
    font-size:0.85rem;
}
button.accept{background:#22c55e;color:white;}
button.complete{background:#3b82f6;color:white;}

/* Profile Card */
.profile-card{
    display:flex;
    align-items:center;
    gap:15px;
    background:rgba(255,255,255,0.05);
    padding:15px 20px;
    border-radius:12px;
    margin:20px;
}
.profile-card img{
    width:80px;height:80px;
    border-radius:12px;
    object-fit:cover;
    border:2px solid #FFD700;
}
.profile-card div p{margin-bottom:5px;opacity:0.85;font-size:0.9rem;}

/* Responsive */
@media(max-width:768px){
    .stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
    header h1{font-size:1.2rem;}
    table, th, td{font-size:0.8rem;}
}
</style>
</head>
<body>

<header>
<h1>Cleaner Dashboard</h1>
<div style="display:flex;align-items:center;">
    <a href="profile.html" class="profile-btn">
        <img id="profileImage" src="placeholder.jpg" alt="Profile Image">
        <span id="profileName">Cleaner Name</span>
    </a>
    <button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<!-- Profile Card -->
<div class="profile-card">
    <img id="dashImage" src="placeholder.jpg" alt="Profile Image">
    <div>
        <h2 id="dashName">Cleaner Name</h2>
        <p><strong>Specialty:</strong> <span id="dashSpecialty"></span></p>
        <p><strong>Experience:</strong> <span id="dashExperience"></span> years</p>
        <p><strong>Rate:</strong> R <span id="dashRate"></span>/hour</p>
    </div>
</div>

<!-- Stats -->
<div class="stats">
    <div class="card">
        <h2 id="pendingCount">0</h2>
        <p>Pending Jobs</p>
    </div>
    <div class="card">
        <h2 id="confirmedCount">0</h2>
        <p>Confirmed Jobs</p>
    </div>
    <div class="card">
        <h2 id="completedCount">0</h2>
        <p>Completed Jobs</p>
    </div>
    <div class="card">
        <h2 id="earnings">R 0</h2>
        <p>Total Earnings</p>
    </div>
</div>

<!-- Bookings Table -->
<h2 style="margin-left:20px;">Booking Requests</h2>
<div style="overflow-x:auto; padding:0 20px;">
<table>
<thead>
<tr>
<th>Client</th>
<th>Date</th>
<th>Hours</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="bookingTable"></tbody>
</table>
</div>

<script>
// Check login
const loggedIn = localStorage.getItem("loggedInCleaner");
if(!loggedIn){window.location.href="cleaner-login.html";}

// Fetch cleaner profile
const users = JSON.parse(localStorage.getItem("cleanerUsers")) || {};
const profile = users[loggedIn].profile;

document.getElementById("profileImage").src = profile.image || "https://via.placeholder.com/80";
document.getElementById("profileName").innerText = profile.name || "Cleaner Name";
document.getElementById("dashImage").src = profile.image || "https://via.placeholder.com/80";
document.getElementById("dashName").innerText = profile.name || "Cleaner Name";
document.getElementById("dashSpecialty").innerText = profile.specialty || "N/A";
document.getElementById("dashExperience").innerText = profile.experience || "N/A";
document.getElementById("dashRate").innerText = profile.rate || "N/A";

// Load Bookings and Stats
function loadBookings(){
    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];
    const table = document.getElementById("bookingTable");
    table.innerHTML="";

    let pending=0, confirmed=0, completed=0, earnings=0;

    bookings.forEach(b=>{
        if(b.cleanerPhone === loggedIn){
            if(b.status==="pending") pending++;
            if(b.status==="confirmed") confirmed++;
            if(b.status==="completed") {completed++; earnings+=b.total;}

            const row = document.createElement("tr");
            row.innerHTML=`
                <td>${b.clientName}</td>
                <td>${b.date}</td>
                <td>${b.hours}</td>
                <td>R ${b.total}</td>
                <td>${b.status}</td>
                <td>
                ${b.status==="pending"?`<button class="action accept" onclick="updateStatus(${b.id},'confirmed')">Accept</button>`:''}
                ${b.status==="confirmed"?`<button class="action complete" onclick="updateStatus(${b.id},'completed')">Complete</button>`:''}
                </td>
            `;
            table.appendChild(row);
        }
    });

    document.getElementById("pendingCount").innerText = pending;
    document.getElementById("confirmedCount").innerText = confirmed;
    document.getElementById("completedCount").innerText = completed;
    document.getElementById("earnings").innerText = "R " + earnings;
}

// Update Booking Status
function updateStatus(id, status){
    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];
    bookings.forEach(b=>{
        if(b.id===id){b.status=status;}
    });
    localStorage.setItem("bookings", JSON.stringify(bookings));
    loadBookings();
}

// Logout
function logout(){
    localStorage.removeItem("loggedInCleaner");
    window.location.href="cleaner-login.html";
}

loadBookings();
</script>

</body>
</html>
