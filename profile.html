<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cleaner Dashboard</title>
<style>
body{font-family:Segoe UI;background:#0f172a;color:white;margin:0;padding:20px;}
header{display:flex;justify-content:space-between;align-items:center;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin:30px 0;}
.card{background:#1e293b;padding:20px;border-radius:12px;text-align:center;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{padding:10px;border-bottom:1px solid #333;text-align:center;}
button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;}
.accept{background:#22c55e;color:white;}
.complete{background:#3b82f6;color:white;}
.logout{background:#ef4444;color:white;padding:8px 12px;}
.profile{display:flex;align-items:center;gap:15px;}
.profile img{width:70px;height:70px;border-radius:12px;object-fit:cover;}
</style>
</head>
<body>

<script>
const loggedIn = localStorage.getItem("loggedInCleaner");
if(!loggedIn){window.location.href="cleaner-auth.html";}
</script>

<header>
<h2>Cleaner Dashboard</h2>
<button class="logout" onclick="logout()">Logout</button>
</header>

<div class="profile" id="profileBox"></div>

<div class="stats">
<div class="card"><h3 id="pendingCount">0</h3><p>Pending Jobs</p></div>
<div class="card"><h3 id="confirmedCount">0</h3><p>Confirmed Jobs</p></div>
<div class="card"><h3 id="completedCount">0</h3><p>Completed Jobs</p></div>
<div class="card"><h3 id="earnings">R 0</h3><p>Total Earnings</p></div>
</div>

<h3>Booking Requests</h3>
<table>
<thead>
<tr>
<th>Client</th>
<th>Date</th>
<th>Hours</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="bookingTable"></tbody>
</table>

<script>

let users = JSON.parse(localStorage.getItem("cleanerUsers"));
let profile = users[loggedIn].profile;

document.getElementById("profileBox").innerHTML=`
<img src="${profile.image}">
<div>
<h3>${profile.name}</h3>
<p>${profile.experience} years experience</p>
</div>
`;

function loadBookings(){

let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
let table=document.getElementById("bookingTable");
table.innerHTML="";

let pending=0,confirmed=0,completed=0,earnings=0;

bookings.forEach(b=>{
if(b.cleanerPhone===loggedIn){

if(b.status==="pending") pending++;
if(b.status==="confirmed") confirmed++;
if(b.status==="completed"){completed++; earnings+=b.total;}

let row=document.createElement("tr");
row.innerHTML=`
<td>${b.clientName}</td>
<td>${b.date}</td>
<td>${b.hours}</td>
<td>R ${b.total}</td>
<td>${b.status}</td>
<td>
${b.status==="pending" ? `<button class="accept" onclick="updateStatus(${b.id},'confirmed')">Accept</button>`:''}
${b.status==="confirmed" ? `<button class="complete" onclick="updateStatus(${b.id},'completed')">Complete</button>`:''}
</td>
`;
table.appendChild(row);
}
});

document.getElementById("pendingCount").innerText=pending;
document.getElementById("confirmedCount").innerText=confirmed;
document.getElementById("completedCount").innerText=completed;
document.getElementById("earnings").innerText="R "+earnings;
}

function updateStatus(id,status){
let bookings=JSON.parse(localStorage.getItem("bookings"));
bookings.forEach(b=>{
if(b.id===id){b.status=status;}
});
localStorage.setItem("bookings",JSON.stringify(bookings));
loadBookings();
}

function logout(){
localStorage.removeItem("loggedInCleaner");
window.location.href="cleaner-auth.html";
}

loadBookings();

</script>

</body>
</html>
