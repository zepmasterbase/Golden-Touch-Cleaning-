<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaner Sign Up / Login - Golden Touch Cleaning</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    font-family:'Montserrat',sans-serif;
    background:#0F0F0F;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#22c55e;
}

.modal{
    background:#1A1A1A;
    padding:40px;
    border-radius:20px;
    width:350px;
    max-width:90%;
    box-shadow:0 0 25px rgba(34,197,94,0.5);
    position:relative;
}

.tabs{
    display:flex;
    justify-content:space-around;
    margin-bottom:20px;
    cursor:pointer;
}
.tabs div{
    padding:10px 20px;
    border-radius:10px;
    transition:0.3s;
    font-weight:600;
}
.tabs .active{
    background:#22c55e;
    color:#0F0F0F;
}

form{
    display:flex;
    flex-direction:column;
}
input{
    margin-bottom:15px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#0F0F0F;
    color:#fff;
    outline:none;
}
button{
    padding:12px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:#0F0F0F;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    box-shadow:0 0 15px #22c55e66;
}

p{
    text-align:center;
    font-size:14px;
    opacity:0.8;
}
a{color:#22c55e; cursor:pointer; text-decoration:none;}
</style>
</head>
<body>

<div class="modal">
    <h1>Golden Touch Cleaning</h1>
    <div class="tabs">
        <div id="loginTab" class="active">Login</div>
        <div id="registerTab">Register</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
        <input type="tel" id="loginPhone" placeholder="Phone Number (+27)" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
        <p>Don't have an account? <a id="toRegister">Register</a></p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" style="display:none;">
        <input type="tel" id="regPhone" placeholder="Phone Number (+27)" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <input type="password" id="regConfirm" placeholder="Confirm Password" required>
        <button type="submit">Register</button>
        <p>Already have an account? <a id="toLogin">Login</a></p>
    </form>
</div>

<script>
// Toggle tabs
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

loginTab.addEventListener("click", ()=>{
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    loginForm.style.display="flex";
    registerForm.style.display="none";
});
registerTab.addEventListener("click", ()=>{
    registerTab.classList.add("active");
    loginTab.classList.remove("active");
    loginForm.style.display="none";
    registerForm.style.display="flex";
});

// Quick links in forms
document.getElementById("toRegister").addEventListener("click", ()=>registerTab.click());
document.getElementById("toLogin").addEventListener("click", ()=>loginTab.click());

// =======================
// LocalStorage Cleaner Users
// =======================
let cleanerUsers = JSON.parse(localStorage.getItem("cleanerUsers")) || {};

// =======================
// Register Form Submit
// =======================
registerForm.addEventListener("submit", e=>{
    e.preventDefault();
    const phone = document.getElementById("regPhone").value.trim();
    const password = document.getElementById("regPassword").value;
    const confirm = document.getElementById("regConfirm").value;

    if(password !== confirm){
        alert("Passwords do not match!");
        return;
    }

    if(cleanerUsers[phone]){
        alert("Account already exists. Please login.");
        loginTab.click();
        return;
    }

    // Create new cleaner
    cleanerUsers[phone] = {
        password,
        profile:{
            name:"",
            specialty:"",
            location:"",
            experience:0,
            rate:0,
            description:"",
            image:"",
            totalJobs:0,
            totalEarnings:0,
            ratings:[]
        },
        approved:false // admin approval required
    };
    localStorage.setItem("cleanerUsers", JSON.stringify(cleanerUsers));
    localStorage.setItem("loggedCleaner", phone);
    alert("Registration successful! Redirecting to dashboard...");
    window.location.href="dashboard.html";
});

// =======================
// Login Form Submit
// =======================
loginForm.addEventListener("submit", e=>{
    e.preventDefault();
    const phone = document.getElementById("loginPhone").value.trim();
    const password = document.getElementById("loginPassword").value;

    if(!cleanerUsers[phone]){
        alert("No account found. Please register.");
        registerTab.click();
        return;
    }

    if(cleanerUsers[phone].password !== password){
        alert("Incorrect password.");
        return;
    }

    localStorage.setItem("loggedCleaner", phone);
    alert("Login successful! Redirecting to dashboard...");
    window.location.href="dashboard.html";
});

// =======================
// Check if already logged in
// =======================
const loggedCleanerPhone = localStorage.getItem("loggedCleaner");
if(loggedCleanerPhone && cleanerUsers[loggedCleanerPhone]){
    window.location.href="dashboard.html";
}
</script>

</body>
</html>
