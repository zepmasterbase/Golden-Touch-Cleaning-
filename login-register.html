<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Touch Cleaning - Login/Register</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    font-family:'Montserrat',sans-serif;
    background:#0F0F0F;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* Modal container */
.modal {
    background:#1A1A1A;
    padding:40px 30px;
    border-radius:20px;
    width:100%;
    max-width:400px;
    box-shadow:0 0 30px rgba(34,197,94,0.5);
    position:relative;
}

/* Header */
.modal h2 {
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
    font-weight:600;
    color:#22c55e;
}

/* Toggle links */
.toggle-link {
    display:block;
    text-align:center;
    margin-bottom:20px;
    color:#22c55e;
    cursor:pointer;
    font-size:14px;
    text-decoration:underline;
}

/* Input fields */
input {
    width:100%;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:12px;
    border:none;
    outline:none;
    background:#0F0F0F;
    color:#fff;
}

/* Buttons */
button {
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:#22c55e;
    color:#0F0F0F;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}
button:hover {
    box-shadow:0 0 15px #22c55e66;
}

/* Hero text above modal */
.hero-text {
    text-align:center;
    margin-bottom:30px;
}
.hero-text h1 {
    font-size:28px;
    font-weight:600;
    margin-bottom:10px;
}
.hero-text p {
    font-size:16px;
    opacity:0.85;
}

/* Responsive */
@media(max-width:480px){
    .modal {
        padding:30px 20px;
    }
}
</style>
</head>
<body>

<div class="hero-text">
    <h1>Be Your Own Boss</h1>
    <p>Sign up to offer your cleaning services or log in to manage your jobs and earnings.</p>
</div>

<div class="modal">
    <h2 id="modal-title">Login</h2>
    <form id="authForm">
        <input type="text" id="phone" placeholder="Phone Number" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="submitBtn">Login</button>
    </form>
    <span class="toggle-link" id="toggleLink">Don't have an account? Register</span>
</div>

<script>
// Grab elements
const authForm = document.getElementById("authForm");
const toggleLink = document.getElementById("toggleLink");
const modalTitle = document.getElementById("modal-title");
const submitBtn = document.getElementById("submitBtn");

let isLogin = true; // toggle state

// Switch between login/register
toggleLink.addEventListener("click", () => {
    isLogin = !isLogin;
    if(isLogin){
        modalTitle.textContent = "Login";
        submitBtn.textContent = "Login";
        toggleLink.textContent = "Don't have an account? Register";
    } else {
        modalTitle.textContent = "Register";
        submitBtn.textContent = "Register";
        toggleLink.textContent = "Already have an account? Login";
    }
});

// Handle form submission
authForm.addEventListener("submit", function(e){
    e.preventDefault();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value.trim();

    // Fetch users
    let users = JSON.parse(localStorage.getItem("cleanerUsers")) || {};

    if(isLogin){
        // LOGIN
        if(users[phone] && users[phone].password === password){
            // Successful login
            localStorage.setItem("loggedCleaner", phone);
            alert("Login successful!");
            window.location.href = "dashboard.html";
        } else {
            alert("Incorrect phone number or password");
        }
    } else {
        // REGISTER
        if(users[phone]){
            alert("Phone number already registered. Please login.");
            return;
        }
        // Create new user
        users[phone] = {
            password: password,
            profile: {
                name: "",
                specialty: "",
                location: "",
                experience: 0,
                rate: 0,
                description: "",
                image: "",
                totalJobs: 0,
                totalEarnings: 0,
                ratings: []
            }
        };
        localStorage.setItem("cleanerUsers", JSON.stringify(users));
        localStorage.setItem("loggedCleaner", phone);
        alert("Registration successful! Complete your profile.");
        window.location.href = "dashboard.html";
    }
});
</script>

</body>
</html>
