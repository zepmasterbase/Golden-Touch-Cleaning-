<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace - Golden Touch Cleaning</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    font-family:'Montserrat',sans-serif;
    background:#0F0F0F;
    color:#fff;
}

header{
    display:flex;
    align-items:center;
    padding:15px 20px;
    background:#111;
    box-shadow:0 2px 8px rgba(0,0,0,0.5);
}
header img.logo{
    width:50px;
    height:50px;
    border-radius:50%;
    margin-right:15px;
}
header h1{
    font-size:22px;
    font-weight:600;
}

.container{
    max-width:1200px;
    margin:20px auto;
    padding:0 15px;
}

.cleaner-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.cleaner-card{
    background:#1A1A1A;
    border-radius:15px;
    padding:20px;
    transition:0.3s;
    box-shadow:0 0 10px #22c55e44;
}
.cleaner-card:hover{
    box-shadow:0 0 15px #22c55e66;
}
.cleaner-card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:10px;
}
.cleaner-card h3{
    margin:0 0 5px 0;
}
.cleaner-card p{
    margin:3px 0;
    font-size:14px;
}
.cleaner-card .rating{
    color:#FFD700;
}
.cleaner-card .approved{
    background:#22c55e;
    color:#0F0F0F;
    font-size:12px;
    padding:2px 6px;
    border-radius:8px;
    display:inline-block;
    margin-top:5px;
}

.book-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:10px 0;
    background:#22c55e;
    color:#0F0F0F;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    text-align:center;
    text-decoration:none;
}
.book-btn:hover{
    box-shadow:0 0 15px #22c55e66;
}

footer{
    text-align:center;
    padding:20px;
    font-size:14px;
    opacity:0.7;
    background:#111;
}
</style>
</head>
<body>

<header>
    <img class="logo" src="https://payhip.com/cdn-cgi/image/format=auto,width=1500/https://pe56d.s3.amazonaws.com/o_1jin4vd70ca01qei1kso11qo1sek15.jpg" alt="Logo">
    <h1>Cleaner Marketplace</h1>
</header>

<div class="container">
    <div class="cleaner-grid" id="cleanerGrid">
        <!-- Cleaner cards populated by JS -->
    </div>
</div>

<footer>
    &copy; 2026 <a href="#">www.goldentouchcleaning.com</a>
</footer>

<script>
// WhatsApp number
const whatsappNumber = "+27624676223";

// Load cleaners
let cleaners = JSON.parse(localStorage.getItem("cleanerUsers")) || {};
const grid = document.getElementById("cleanerGrid");

function renderCleaners(){
    grid.innerHTML = "";
    for(let phone in cleaners){
        let profile = cleaners[phone].profile;
        if(!profile.approved) continue; // Only approved cleaners

        // Calculate average rating
        let avgRating = profile.ratings?.length ? (profile.ratings.reduce((a,b)=>a+b,0)/profile.ratings.length).toFixed(1) : "N/A";

        const card = document.createElement("div");
        card.classList.add("cleaner-card");
        card.innerHTML = `
            <img src="${profile.image || 'https://via.placeholder.com/300'}" alt="${profile.name}">
            <h3>${profile.name}</h3>
            <p>${profile.specialty} | ${profile.location}</p>
            <p class="rating">⭐ ${avgRating}</p>
            <p class="approved">Verified</p>
            <p>Rate: R${profile.rate || 0}/hour</p>
            <a href="https://wa.me/${whatsappNumber}?text=Hi ${profile.name}, I want to book your cleaning service" class="book-btn" target="_blank" onclick="bookCleaner('${phone}')">Book via WhatsApp</a>
        `;
        grid.appendChild(card);
    }
}

// Function to update cleaner stats after booking
function bookCleaner(phone){
    let cleaners = JSON.parse(localStorage.getItem("cleanerUsers")) || {};
    let profile = cleaners[phone]?.profile || {};
    profile.totalJobs = (profile.totalJobs || 0) + 1;
    profile.totalEarnings = (profile.totalEarnings || 0) + (profile.rate || 0);
    cleaners[phone].profile = profile;
    localStorage.setItem("cleanerUsers", JSON.stringify(cleaners));
}

// Initial render
renderCleaners();

// Update in real-time if localStorage changes
window.addEventListener("storage", function(e){
    if(e.key==="cleanerUsers"){
        cleaners = JSON.parse(e.newValue);
        renderCleaners();
    }
});
</script>

</body>
</html>
