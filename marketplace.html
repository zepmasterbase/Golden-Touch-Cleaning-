<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace - Golden Touch Cleaning</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}

body{
    background:#0F0F0F;
    color:#fff;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:#111;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 15px rgba(0,0,0,0.6);
}

.logo-container{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-container img{
    width:50px;
    height:50px;
    border-radius:50%;
    border:2px solid #22c55e;
}

.logo-text{
    font-weight:600;
    font-size:20px;
}

.search-bar{
    max-width:400px;
    width:100%;
}

.search-bar input{
    width:100%;
    padding:10px 15px;
    border-radius:25px;
    border:none;
    background:#1a1a1a;
    color:#fff;
    outline:none;
}

/* CLEANER GRID */
.cleaners{
    max-width:1200px;
    margin:40px auto;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.card{
    background:#1a1a1a;
    border-radius:18px;
    overflow:hidden;
    transition:0.3s;
    position:relative;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 0 25px rgba(34,197,94,0.4);
}

.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
}

.badge{
    position:absolute;
    top:12px;
    left:12px;
    background:#22c55e;
    color:#000;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.card-content{
    padding:18px;
}

.card-content h3{
    margin-bottom:5px;
}

.card-content p{
    font-size:14px;
    opacity:0.8;
    margin-bottom:8px;
}

.rating{
    margin:8px 0;
    color:#22c55e;
    font-size:14px;
}

.book-btn{
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:#000;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.book-btn:hover{
    box-shadow:0 0 15px #22c55e;
}

footer{
    text-align:center;
    padding:20px;
    background:#111;
    opacity:0.7;
    margin-top:40px;
}

/* MOBILE */
@media(max-width:768px){
    .search-bar{display:none;}
}
</style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jinh5i6ubuplj91nb41rbdl8v15.png">
        <span class="logo-text">Golden Touch Cleaning</span>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by name, city or speciality...">
    </div>
</header>

<section class="cleaners" id="cleanerGrid"></section>

<footer>
    © 2026 Golden Touch Cleaning. Verified & Trusted Professionals.
</footer>

<script>
const cleaners = [
{
    id:1,
    name:"Jane Doe",
    city:"Johannesburg",
    speciality:"Kitchen & Bathroom Specialist",
    rate:95,
    image:"https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jinih43743q1gp277i8pk1o1015.jpg"
},
{
    id:2,
    name:"John Smith",
    city:"Pretoria",
    speciality:"Luxury Residential Cleaning",
    rate:120,
    image:"https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jinih7ne1qg11gbo1kqr1hvpd171b.jpg"
},
{
    id:3,
    name:"Michael T.",
    city:"Cape Town",
    speciality:"General Cleaning Expert",
    rate:95,
    image:"https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jinj9bfm32n176d1tt0vbt9ms1b.jpg"
},
{
    id:4,
    name:"Emily R.",
    city:"Durban",
    speciality:"Luxury & Office Cleaning",
    rate:120,
    image:"https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jinj96btmio1qp54cqjic97n15.jpg"
}
];

function renderCleaners(list){
    const grid=document.getElementById("cleanerGrid");
    grid.innerHTML="";

    list.forEach(cleaner=>{
        const ratingData = JSON.parse(localStorage.getItem("ratings_"+cleaner.id)) || {total:0,count:0};
        const average = ratingData.count>0 ? (ratingData.total/ratingData.count).toFixed(1) : "New";

        grid.innerHTML+=`
        <div class="card">
            <img src="${cleaner.image}">
            <span class="badge">Verified</span>
            <div class="card-content">
                <h3>${cleaner.name}</h3>
                <p>${cleaner.city}</p>
                <p>${cleaner.speciality}</p>
                <div class="rating">⭐ ${average} (${ratingData.count} reviews)</div>
                <p>Rate: R${cleaner.rate}/hr</p>
                <button class="book-btn" onclick="bookCleaner(${cleaner.id}, ${cleaner.rate})">
                    Book via WhatsApp
                </button>
            </div>
        </div>
        `;
    });
}

function bookCleaner(id, rate){
    let jobs = parseInt(localStorage.getItem("totalJobs")) || 0;
    let earnings = parseFloat(localStorage.getItem("totalEarnings")) || 0;

    jobs += 1;
    earnings += rate;

    localStorage.setItem("totalJobs", jobs);
    localStorage.setItem("totalEarnings", earnings);

    window.open("https://wa.me/27624676223","_blank");
}

document.getElementById("searchInput").addEventListener("keyup",function(){
    const value=this.value.toLowerCase();
    const filtered = cleaners.filter(c =>
        c.name.toLowerCase().includes(value) ||
        c.city.toLowerCase().includes(value) ||
        c.speciality.toLowerCase().includes(value)
    );
    renderCleaners(filtered);
});

renderCleaners(cleaners);
</script>

</body>
</html>
