<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Cleaners Marketplace</title>
<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:0;
}
header{
    text-align:center;
    padding:40px 20px;
}
header h1{
    font-weight:600;
    font-size:32px;
}
header p{
    margin-top:10px;
    opacity:0.8;
}
.container{
    max-width:1200px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:0 20px;
}
.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border-radius:15px;
    padding:20px;
    transition:0.3s ease;
    display:flex;
    flex-direction:column;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(0,255,255,0.2);
}
.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:15px;
}
.badge{
    display:inline-block;
    padding:4px 10px;
    background:#22c55e;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}
.details{
    font-size:14px;
    opacity:0.9;
    margin-bottom:5px;
}
.rating{
    font-size:14px;
    color:#FFD700;
    margin-bottom:8px;
}
button{
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00f2ff,#7c3aed);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    box-shadow:0 0 15px #00f2ff66;
}
.modal{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.6);
}
.modal-content{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    width:320px;
}
.modal-content input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border:none;
    border-radius:6px;
}
.close{float:right;cursor:pointer;color:red;}
.empty{
    text-align:center;
    margin-top:50px;
    opacity:0.7;
}
</style>
</head>
<body>

<header>
<h1>Find Verified Cleaners Near You</h1>
<p>Professional. Trusted. Rated by clients.</p>
</header>

<div class="container" id="cleanerContainer"></div>
<p class="empty" id="emptyMsg">Loading cleaners...</p>

<!-- Booking Modal -->
<div class="modal" id="bookingModal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<h3>Book Cleaner</h3>
<input type="text" id="clientName" placeholder="Your Name" required>
<input type="text" id="clientPhone" placeholder="Your Phone" required>
<input type="date" id="serviceDate" required>
<input type="number" id="hours" placeholder="Number of Hours" required>
<button onclick="submitBooking()">Submit Booking</button>
</div>
</div>

<script>
// Business WhatsApp number
const businessWhatsAppNumber = "27624676223";

// Helper: Haversine distance formula
function distance(lat1, lon1, lat2, lon2) {
    const R = 6371; // km
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// Load cleaners
const container = document.getElementById("cleanerContainer");
const emptyMsg = document.getElementById("emptyMsg");

let users = JSON.parse(localStorage.getItem("cleanerUsers")) || {};
let cleanersFound = 0;
let clientLat=0, clientLon=0;

// Get client location
navigator.geolocation.getCurrentPosition(pos=>{
    clientLat=pos.coords.latitude;
    clientLon=pos.coords.longitude;
    displayCleaners();
}, err=>{
    alert("Location access needed to find cleaners near you.");
    displayCleaners();
});

let selectedCleaner = null;

function displayCleaners(){
    container.innerHTML="";
    cleanersFound=0;

    for(let phone in users){
        let u = users[phone];
        if(u.profile && u.approved){
            const p = u.profile;
            
            // Geo filter (if location known)
            let show = true;
            if(clientLat && clientLon && p.lat && p.lon){
                let d = distance(clientLat, clientLon, p.lat, p.lon);
                if(d>8){show=false;} // ~5 miles = 8 km
            }

            if(show){
                cleanersFound++;
                
                let ratings = p.ratings || [];
                let avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : "N/A";
                let stars = "";
                if(avgRating!=="N/A"){
                    let full = Math.floor(avgRating);
                    let half = avgRating - full >=0.5 ? 1 : 0;
                    let empty = 5 - full - half;
                    stars = "★".repeat(full) + (half?"½":"") + "☆".repeat(empty);
                } else {
                    stars = "No ratings";
                }

                const card = document.createElement("div");
                card.className="card";
                card.innerHTML=`
                    <img src="${p.image || 'https://via.placeholder.com/400x300'}">
                    <span class="badge">Verified Cleaner</span>
                    <h3>${p.name}</h3>
                    <div class="rating">${stars} (${avgRating})</div>
                    <div class="details"><strong>Specialty:</strong> ${p.specialty}</div>
                    <div class="details"><strong>Experience:</strong> ${p.experience} years</div>
                    <div class="details"><strong>Rate:</strong> R ${p.rate}/hour</div>
                    <button onclick="openBooking('${phone}')">Book Cleaner</button>
                `;
                container.appendChild(card);
            }
        }
    }
    if(cleanersFound===0){
        emptyMsg.innerText="No verified cleaners nearby. Try expanding your location range.";
    } else {
        emptyMsg.innerText="";
    }
}

// Booking Modal
function openBooking(phone){
    selectedCleaner = phone;
    document.getElementById("bookingModal").style.display="flex";
}

function closeModal(){
    document.getElementById("bookingModal").style.display="none";
}

function submitBooking(){
    const clientName=document.getElementById("clientName").value;
    const clientPhone=document.getElementById("clientPhone").value;
    const date=document.getElementById("serviceDate").value;
    const hours=document.getElementById("hours").value;

    if(!clientName||!clientPhone||!date||!hours){
        alert("Please fill all fields");
        return;
    }

    const rate = users[selectedCleaner].profile.rate;
    const total = rate*hours;

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
    bookings.push({
        id:Date.now(),
        cleanerPhone:selectedCleaner,
        clientName,
        clientPhone,
        date,
        hours,
        rate,
        total,
        status:"pending"
    });
    localStorage.setItem("bookings",JSON.stringify(bookings));
    alert("Booking request sent! Cleaner will confirm shortly.");
    closeModal();
}
</script>

</body>
</html>
