<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verified Cleaners Marketplace</title>
<style>
body{font-family:Segoe UI;background:#0f172a;color:white;margin:0;}
header{text-align:center;padding:40px;}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px;padding:30px;}
.card{background:#1e293b;padding:20px;border-radius:15px;}
.card img{width:100%;height:200px;object-fit:cover;border-radius:12px;}
button{margin-top:10px;padding:10px;border:none;border-radius:8px;background:#00c2ff;color:white;cursor:pointer;width:100%;}
.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:none;justify-content:center;align-items:center;
}
.modal-content{
background:#1e293b;padding:25px;border-radius:15px;width:320px;
}
input{width:100%;padding:8px;margin-bottom:10px;border:none;border-radius:6px;}
.close{float:right;cursor:pointer;color:red;}
</style>
</head>
<body>

<header>
<h1>Find Verified Cleaners</h1>
<p>Book trusted professionals instantly</p>
</header>

<div class="container" id="cleanerContainer"></div>

<div class="modal" id="bookingModal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<h3>Book Cleaner</h3>
<input type="text" id="clientName" placeholder="Your Name" required>
<input type="text" id="clientPhone" placeholder="Your Phone" required>
<input type="date" id="serviceDate" required>
<input type="number" id="hours" placeholder="Number of Hours" required>
<button onclick="submitBooking()">Submit Booking</button>
</div>
</div>

<script>

let selectedCleaner = null;

let users = JSON.parse(localStorage.getItem("cleanerUsers")) || {};
let container = document.getElementById("cleanerContainer");

for(let phone in users){
if(users[phone].profile){
let p = users[phone].profile;
let card = document.createElement("div");
card.className="card";
card.innerHTML=`
<img src="${p.image}">
<h3>${p.name}</h3>
<p>${p.specialty}</p>
<p>R ${p.rate}/hour</p>
<button onclick="openBooking('${phone}')">Book Cleaner</button>
`;
container.appendChild(card);
}
}

function openBooking(phone){
selectedCleaner = phone;
document.getElementById("bookingModal").style.display="flex";
}

function closeModal(){
document.getElementById("bookingModal").style.display="none";
}

function submitBooking(){

let clientName=document.getElementById("clientName").value;
let clientPhone=document.getElementById("clientPhone").value;
let date=document.getElementById("serviceDate").value;
let hours=document.getElementById("hours").value;

if(!clientName||!clientPhone||!date||!hours){
alert("Please fill all fields");
return;
}

let users = JSON.parse(localStorage.getItem("cleanerUsers"));
let rate = users[selectedCleaner].profile.rate;
let total = rate * hours;

let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

bookings.push({
id:Date.now(),
cleanerPhone:selectedCleaner,
clientName,
clientPhone,
date,
hours,
rate,
total,
status:"pending"
});

localStorage.setItem("bookings",JSON.stringify(bookings));

alert("Booking request sent!");
closeModal();
}

</script>
</body>
</html>
