<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Cleaners Marketplace</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-weight:600;
    font-size:32px;
}

header p{
    margin-top:10px;
    opacity:0.8;
}

.container{
    max-width:1200px;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
    padding:0 20px;
}

.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.1);
    transition:0.3s ease;
    display:flex;
    flex-direction:column;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px rgba(0,255,255,0.15);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:6px;
}

.badge{
    display:inline-block;
    padding:4px 10px;
    background:#22c55e;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.details{
    font-size:14px;
    opacity:0.9;
    margin-bottom:8px;
}

.bio{
    font-size:13px;
    opacity:0.8;
    margin:10px 0;
    flex-grow:1;
}

.rate{
    font-weight:600;
    margin:10px 0;
}

button{
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00f2ff,#7c3aed);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    box-shadow:0 0 20px #00f2ff66;
}

.empty{
    text-align:center;
    margin-top:80px;
    opacity:0.7;
}
</style>
</head>

<body>

<header>
    <h1>Find Verified Cleaners Near You</h1>
    <p>Trusted. Professional. Ready to Book.</p>
</header>

<div class="container" id="cleanerContainer"></div>

<p class="empty" id="emptyMsg"></p>

<script>

// Replace with your business WhatsApp number (international format, no +)
const businessWhatsAppNumber = "27600000000"; // <-- PUT YOUR REAL NUMBER HERE

const container = document.getElementById("cleanerContainer");
const emptyMsg = document.getElementById("emptyMsg");

let users = JSON.parse(localStorage.getItem("cleanerUsers")) || {};
let cleanersFound = 0;

for(let phone in users){

    if(users[phone].profile){

        const profile = users[phone].profile;

        if(profile.name && profile.area && profile.rate){

            cleanersFound++;

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <img src="${profile.image || 'https://via.placeholder.com/400x300'}">
                <span class="badge">Verified Cleaner</span>
                <h3>${profile.name}</h3>
                <div class="details"><strong>Area:</strong> ${profile.area}</div>
                <div class="details"><strong>Specialty:</strong> ${profile.specialty}</div>
                <div class="details"><strong>Experience:</strong> ${profile.experience} years</div>
                <div class="rate">R ${profile.rate} / hour</div>
                <div class="bio">${profile.bio}</div>
                <button onclick="bookCleaner('${profile.name}','${profile.specialty}','${profile.rate}')">
                    Book via WhatsApp
                </button>
            `;

            container.appendChild(card);
        }
    }
}

if(cleanersFound === 0){
    emptyMsg.innerText = "No verified cleaners available yet.";
}

// WhatsApp booking function
function bookCleaner(name, specialty, rate){

    const message = `Hello, I would like to book ${name} (${specialty}) at R ${rate}/hour. Please assist.`;
    const url = `https://wa.me/${businessWhatsAppNumber}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
}

</script>

</body>
</html>
