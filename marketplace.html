<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Touch Marketplace - Find Verified Cleaners</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Montserrat', sans-serif;
    margin:0;
    background:#0F0F0F;
    color:#fff;
}

/* Header */
header{
    background:#E5E5E5;
    color:#0F0F0F;
    padding:18px 20px;
    text-align:center;
    font-weight:600;
    font-size:20px;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #ccc;
    animation:pulseHeader 3s infinite;
}
@keyframes pulseHeader {
    0%,100% {opacity:1;}
    50% {opacity:0.85;}
}

/* Search & Service filter */
.search-bar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:15px 0;
    flex-wrap:wrap;
}
.search-bar select, .search-bar input[type="number"]{
    padding:8px 12px;
    border-radius:10px;
    border:none;
    font-size:14px;
}
.search-bar button{
    padding:8px 14px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:#0F0F0F;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}
.search-bar button:hover{
    box-shadow:0 0 10px #22c55e55;
}

/* Cleaner cards */
.container{
    max-width:1200px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:20px;
    padding:0 15px;
}

.card{
    background:#1A1A1A;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    display:flex;
    flex-direction:column;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(34,197,94,0.4);
}
.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-bottom:2px solid #22c55e;
}
.card .info{
    padding:12px;
    flex-grow:1;
    display:flex;
    flex-direction:column;
}
.card .badge{
    position:absolute;
    top:10px;
    left:10px;
    background:#22c55e;
    padding:4px 10px;
    font-size:12px;
    border-radius:20px;
    font-weight:600;
}
.card h3{
    margin:5px 0;
    font-size:16px;
    font-weight:600;
}
.card .details{
    font-size:13px;
    opacity:0.85;
    margin-bottom:5px;
}
.card .rating{
    color:#22c55e;
    font-size:14px;
    margin-bottom:10px;
}
.card button{
    padding:8px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:#0F0F0F;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}
.card button:hover{
    box-shadow:0 0 12px #22c55e55;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:1000;
}
.modal-content{
    background:#1A1A1A;
    border-radius:15px;
    padding:25px;
    max-width:400px;
    width:90%;
    position:relative;
}
.modal-content img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:15px;
}
.modal-content .close{
    position:absolute;
    top:10px; right:15px;
    cursor:pointer;
    font-size:18px;
    color:#ef4444;
}
.modal-content h2{margin-bottom:8px;}
.modal-content p{margin-bottom:6px; opacity:0.85;}
.modal-content .rating{color:#22c55e; margin-bottom:10px;}
.modal-content button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:#0F0F0F;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}
.modal-content button:hover{
    box-shadow:0 0 10px #22c55e55;
}

/* Responsive */
@media(max-width:768px){
    .card img{height:150px;}
    .modal-content img{height:150px;}
    header{font-size:18px;}
}
</style>
</head>
<body>

<header>
    Browse Verified Cleaners
</header>

<div class="search-bar">
    <select id="serviceType">
        <option value="all">All Services</option>
        <option value="Kitchen">Kitchen</option>
        <option value="Bathroom">Bathroom</option>
        <option value="Hotel">Luxury Hotel Room</option>
        <option value="General">General Cleaning</option>
    </select>
    <label for="radius">Radius (miles):</label>
    <input type="number" id="radius" value="5" min="1" max="20">
    <button onclick="displayCleaners()">Search</button>
</div>

<div class="container" id="cleanerContainer"></div>
<p id="emptyMsg" style="text-align:center; margin-top:30px; opacity:0.7;"></p>

<!-- Modal -->
<div class="modal" id="cleanerModal">
<div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <img id="modalImage" src="https://via.placeholder.com/400x300">
    <h2 id="modalName">Name</h2>
    <div class="rating" id="modalRating">⭐⭐⭐</div>
    <p><strong>Specialty:</strong> <span id="modalSpecialty"></span></p>
    <p><strong>Experience:</strong> <span id="modalExperience"></span> years</p>
    <p><strong>Rate:</strong> R <span id="modalRate"></span>/hour</p>
    <button id="bookBtn">Book Cleaner</button>
</div>
</div>

<script>
const businessWhatsAppNumber = "27624676223";
let clientLat=0, clientLon=0;

navigator.geolocation.getCurrentPosition(pos=>{
    clientLat=pos.coords.latitude;
    clientLon=pos.coords.longitude;
    displayCleaners();
}, err=>{
    displayCleaners();
});

// Haversine formula
function distance(lat1, lon1, lat2, lon2){
    const R=6371;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    const c=2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R*c;
}

function displayCleaners(){
    const container=document.getElementById("cleanerContainer");
    const serviceFilter = document.getElementById("serviceType").value;
    const radiusMiles = Number(document.getElementById("radius").value);
    const radiusKm = radiusMiles*1.60934;
    container.innerHTML="";
    let found=0;
    const users = JSON.parse(localStorage.getItem("cleanerUsers")) || {};
    for(let phone in users){
        const u=users[phone];
        if(u.profile && u.approved){
            const p=u.profile;
            if(serviceFilter !== 'all' && p.specialty !== serviceFilter) continue;
            let show=true;
            if(clientLat && clientLon && p.lat && p.lon){
                const d=distance(clientLat, clientLon, p.lat, p.lon);
                if(d>radiusKm) show=false;
            }
            if(show){
                found++;
                const ratings=p.ratings||[];
                const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : "N/A";
                let stars="";
                if(avgRating!=="N/A"){
                    let full=Math.floor(avgRating);
                    let half=avgRating-full>=0.5?1:0;
                    let empty=5-full-half;
                    stars="★".repeat(full)+(half?"½":"")+"☆".repeat(empty);
                } else stars="No ratings";
                const card=document.createElement("div");
                card.className="card";
                card.innerHTML=`
                    <img src="${p.image||'https://via.placeholder.com/400x300'}">
                    <span class="badge">Verified</span>
                    <div class="info">
                        <h3>${p.name}</h3>
                        <div class="details"><strong>Specialty:</strong> ${p.specialty}</div>
                        <div class="details"><strong>Experience:</strong> ${p.experience} years</div>
                        <div class="rating">${stars} (${avgRating})</div>
                        <button>View Profile</button>
                    </div>
                `;
                card.onclick=()=>openModal(phone);
                container.appendChild(card);
            }
        }
    }
    document.getElementById("emptyMsg").innerText = found===0 ? "No cleaners found matching your criteria." : "";
}

// Modal functions
let selectedCleaner=null;
function openModal(phone){
    selectedCleaner=phone;
    const p=JSON.parse(localStorage.getItem("cleanerUsers"))[phone].profile;
    document.getElementById("modalImage").src=p.image||'https://via.placeholder.com/400x300';
    document.getElementById("modalName").innerText=p.name;
    const ratings=p.ratings||[];
    const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : "N/A";
    let stars="";
    if(avgRating!=="N/A"){
        let full=Math.floor(avgRating);
        let half=avgRating-full>=0.5?1:0;
        let empty=5-full-half;
        stars="★".repeat(full)+(half?"½":"")+"☆".repeat(empty);
    } else stars="No ratings";
    document.getElementById("modalRating").innerText=`${stars} (${avgRating})`;
    document.getElementById("modalSpecialty").innerText=p.specialty;
    document.getElementById("modalExperience").innerText=p.experience;
    document.getElementById("modalRate").innerText=p.rate;
    document.getElementById("bookBtn").onclick=()=>bookCleaner(phone);
    document.getElementById("cleanerModal").style.display="flex";
}
function closeModal(){document.getElementById("cleanerModal").style.display="none";}
function bookCleaner(phone){
    const p=JSON.parse(localStorage.getItem("cleanerUsers"))[phone].profile;
    const message=`Hi ${p.name}, I would like to book your cleaning service.`;
    window.open(`https://wa.me/${businessWhatsAppNumber}?text=${encodeURIComponent(message)}`);
}
</script>
</body>
</html>
